name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: misaki
    steps:
      - uses: actions/checkout@v4
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet Xcode
        run: xcodegen generate
      - name: Compiler (sans signature)
        run: |
          PROJ=$(ls -d *.xcodeproj | head -1)
          xcodebuild -list -project "$PROJ"
          SCHEME=$(xcodebuild -list -json -project "$PROJ" | python3 -c "import json,sys; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "Scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Créer l'IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r App.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: misaki/App.ipa
